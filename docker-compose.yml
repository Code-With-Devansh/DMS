services:
  postgres:
    image: postgres:18
    container_name: DMS-postgres
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DMS

    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    container_name: DMS-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: DMS-migrate
      restart: "no"
      env_file: .env
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - internal
      environment:
        DATABASE_URL: postgres://postgres:postgres@postgres:5432/DMS
      command: npx drizzle-kit migrate
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DMS-api

    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./.fabric-crypto:/fabric/crypto:ro
    ports:
      - "3000:3000"
    networks:
      - internal
      - fabric
    environment:
      PORT: 3000

      DATABASE_URL: postgres://postgres:postgres@postgres:5432/DMS
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # Object storage — prod points at managed S3 / gov-cloud (no MinIO here).
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-${STORAGE_ENDPOINT}}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-dms-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      STORAGE_SSE: ${STORAGE_SSE:-AES256}

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: DMS-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      # No `clamav:` entry — it's no longer a service on this compose file/host.
      # It runs on its own VM (docker-compose.clamav.yml); reachability is
      # verified at runtime by the fail-closed scan() contract in
      # src/processing/clamav.js (a connection failure throws -> job retries),
      # not by a compose healthcheck that can't reach across hosts. Run
      # `node scripts/check-clamav.js` after deploying to confirm connectivity
      # before relying on it.
    volumes:
      - ./.fabric-crypto:/fabric/crypto:ro
    networks:
      - internal
      - fabric
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/DMS
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Object storage + search: the intelligence pipeline reads bytes and indexes.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-dms-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      STORAGE_SSE: ${STORAGE_SSE:-AES256}
      # Remote ClamAV VM's private IP (OCI VCN) — set CLAMAV_HOST in .env.
      # Never point this at a public IP; see ops/clamav-vm-network.md.
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: "3310"
    command: node src/worker.js

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge

  fabric:
    external: true
    name: fabric_test