services:
  postgres:
    image: postgres:18
    container_name: fabricq-postgres
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DMS

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: fabricq-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DMS-api

    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis

    ports:
      - "3000:3000"
    networks:
      - internal
    environment:
      PORT: 3000

      DATABASE_URL: postgres://postgres:postgres@postgres:5432/DMS
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # Object storage — prod points at managed S3 / gov-cloud (no MinIO here).
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-${STORAGE_ENDPOINT}}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-dms-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      STORAGE_SSE: ${STORAGE_SSE:-AES256}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DMS-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - clamav
      - ocr
    networks:
      - internal
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/DMS
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Object storage + search: the intelligence pipeline reads bytes and indexes.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-dms-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      STORAGE_SSE: ${STORAGE_SSE:-AES256}
      OPENSEARCH_NODES: ${OPENSEARCH_NODES:-http://opensearch:9200}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OCR_URL: http://ocr:8000
    command: node src/worker.js

  clamav:
    image: clamav/clamav:1.3
    container_name: DMS-clamav
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    volumes:
      - clamav_data:/var/lib/clamav

  ocr:
    build:
      context: ./services/ocr
    container_name: DMS-ocr
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ocr_models:/root/.paddleocr

volumes:
  postgres_data:
  redis_data:
  clamav_data:
  ocr_models:

networks:
  internal:
    driver: bridge